name: Test

# Installs every manifest with Scoop on Windows and runs it, on each change.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install clif from this bucket
        shell: pwsh
        run: |
          scoop bucket add cfmleditor "$env:GITHUB_WORKSPACE"
          scoop install cfmleditor/clif
          if ($LASTEXITCODE -ne 0) { throw "scoop install failed: $LASTEXITCODE" }

      - name: Run it, by both names
        shell: pwsh
        run: |
          $want = (Get-Content bucket\clif.json -Raw | ConvertFrom-Json).version
          $out = & clif --version
          $legacy = & cfmleditor-lsp --version
          "$out / $legacy"
          if ($out -ne "clif $want") { throw "clif --version printed '$out', want 'clif $want'" }
          if ($legacy -ne "clif $want") { throw "cfmleditor-lsp --version printed '$legacy'" }

      - name: Check the autoupdate would resolve
        shell: pwsh
        run: |
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -App clif -Dir "$env:GITHUB_WORKSPACE\bucket"
